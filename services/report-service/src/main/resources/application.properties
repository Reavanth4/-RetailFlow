spring.application.name=report-service
server.port=8089
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

## ==========================
## Service-to-Service Configuration
## ==========================
product-service.url=${PRODUCT_SERVICE_URL:http://product-service}
inventory-service.url=${INVENTORY_SERVICE_URL:http://inventory-service}
purchase-service.url=${PURCHASE_SERVICE_URL:http://purchase-service}
sales-service.url=${SALES_SERVICE_URL:http://sales-service}

## ==========================
## Database (H2 in-memory for learning)
## ==========================
spring.datasource.url=jdbc:h2:mem:reportdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
