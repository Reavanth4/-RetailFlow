spring.application.name=report-service
server.port=8089

## ==========================
## Service-to-Service Configuration
## ==========================
product-service.url=http://localhost:8081
inventory-service.url=http://localhost:8083
purchase-service.url=http://localhost:8085
sales-service.url=http://localhost:8087

## ==========================
## Database (H2 in-memory for learning)
## ==========================
spring.datasource.url=jdbc:h2:mem:reportdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
